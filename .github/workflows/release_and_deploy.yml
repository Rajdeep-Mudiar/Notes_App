name: Build & Release Notoo APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions: write-all

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Verify Flutter Code
        run: |
          cd frontend
          flutter test --no-pub

      - name: Build Android Release APK
        run: |
          cd frontend
          flutter build apk --release --android-skip-build-dependency-validation --dart-define=API_BASE_URL=https://notes-app-f0ae.onrender.com

      - name: Generate Version & Tag
        id: tag_gen
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            RELEASE_TAG="v1.0.$(date +'%Y%m%d%H%M')"
          fi
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_assets
          cp frontend/build/app/outputs/flutter-apk/app-release.apk release_assets/Notoo-${{ steps.tag_gen.outputs.tag }}.apk
          cp frontend/build/app/outputs/flutter-apk/app-release.apk release_assets/Notoo-latest.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_gen.outputs.tag }}
          name: "Notoo Release ${{ steps.tag_gen.outputs.tag }}"
          body: |
            ## 🚀 Notoo Android Release (${{ steps.tag_gen.outputs.tag }})

            ### ✨ Features & Capabilities:
            - **Notoo Workspace**: Block notes, AI study synthesizer, exam & assignment scheduler.
            - **Google 1-Tap Sign-In & Offline Resilience**: Smooth instant onboarding with optional details.
            - **Groq High-Speed LLM**: Powered by ultra-fast Llama-3.3-70B and Round-Robin key rotation.
            - **Zero Overflow UI**: Tailored for all Android form factors.
            - **Auto-Update System**: In-app notifications for future updates.

            ### 📲 Download & Install:
            Download **`Notoo-${{ steps.tag_gen.outputs.tag }}.apk`** (or `Notoo-latest.apk`) below to install on your Android phone.
          files: |
            release_assets/Notoo-${{ steps.tag_gen.outputs.tag }}.apk
            release_assets/Notoo-latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
